<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Help · TapTayo</title>
  <meta name="description" content="Answers to common questions about TapTayo — setup, plans, payments, cafés, salons, laundry, Airbnb, freelancers — and chat with us." />
  <link rel="stylesheet" href="/src/fonts.css" />
  <style>
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; color: #141414; background: #FFFBF5; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .top a { color: #141414; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    h1 { font-size: clamp(32px, 6vw, 48px); letter-spacing: -.04em; margin: 28px 0 6px; }
    .lead { color: #57534E; margin: 0 0 18px; }
    .search { width: 100%; box-sizing: border-box; border: 3px solid #141414; border-radius: 999px; padding: 14px 20px; font: 600 16px Poppins, system-ui; box-shadow: 4px 4px 0 #141414; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .chips button { border: 2px solid #141414; background: #fff; border-radius: 999px; padding: 7px 13px; font: 700 13px Poppins, system-ui; cursor: pointer; }
    .chips button.on { background: #141414; color: #fff; }
    h2 { font-size: 20px; margin: 26px 0 8px; }
    details { background: #fff; border: 2px solid #141414; border-radius: 16px; padding: 12px 16px; margin: 8px 0; }
    summary { font-weight: 700; cursor: pointer; }
    details p { margin: 8px 0 0; color: #3B3633; line-height: 1.55; }
    .cta { margin-top: 30px; background: #141414; color: #fff; border-radius: 20px; padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .cta button { border: 0; background: #fff; color: #141414; border-radius: 999px; padding: 12px 18px; font: 800 15px Poppins, system-ui; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a href="/"><img src="/logo/taptayo-mark.svg" alt="" width="32" height="32" /> taptayo</a><a href="/login/">Log in</a></div>
    <h1>How can we help?</h1>
    <p class="lead">Search the answers below — or chat with us. We reply within 24 hours, no calls needed.</p>
    <input class="search" id="q" placeholder="Search: GCash, printer, Airbnb sync, staff PIN…" aria-label="Search help" />
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <div class="cta"><div><b>Still stuck?</b><div style="opacity:.8;font-size:14px">Send us a message with a screenshot. We'll fix it — and if it was our fault, we add free days to your plan.</div></div><button id="chat">💬 Message TapTayo</button></div>
  </div>
  <script type="module" src="/src/help.js"></script>
</body>
</html>
