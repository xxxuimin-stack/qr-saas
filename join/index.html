<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#C62828" />
  <meta name="robots" content="noindex" />
  <title>Join the team</title>
  <style>
    :root { --brand: #FF5A36; --ink: #141414; --muted: #57534E; --paper: #FFFBF2; --surface: #fff; --grid: #EFE6D6; --lime: #D4FF3A; --lilac: #C9B8FF; --mango: #FFB627; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: var(--ink); background: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 420px; background: var(--surface); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 6px 6px 0 var(--ink); padding: 26px 22px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; border: 3px solid var(--ink); object-fit: cover; background: var(--lime); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6rem; }
    h1 { font-size: 1.5rem; margin: 14px 0 4px; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 6px 0; line-height: 1.45; }
    .roles { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
    .roles span { background: var(--lilac); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: .85rem; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    input { width: 100%; font: inherit; font-size: 1rem; padding: 12px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; }
    input:focus { outline: 3px solid var(--brand); outline-offset: 2px; }
    .pin { letter-spacing: .4em; font-weight: 800; text-align: center; font-size: 1.3rem; }
    button { width: 100%; margin-top: 18px; font: inherit; font-weight: 800; font-size: 1.05rem; padding: 14px; border: 3px solid var(--ink); border-radius: 16px; background: var(--brand); color: #fff; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    button:disabled { opacity: .6; cursor: wait; }
    .err { background: #FFE4E0; border: 2px solid #B42318; color: #7A1A10; border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-weight: 600; }
    .ok { background: var(--lime); border: 3px solid var(--ink); border-radius: 16px; padding: 14px; margin-top: 12px; }
    ol { padding-left: 20px; color: var(--ink); line-height: 1.6; }
    .small { font-size: .85rem; }
    .spin { width: 34px; height: 34px; border: 4px solid var(--grid); border-top-color: var(--brand); border-radius: 50%; animation: s 1s linear infinite; margin: 30px auto; }
    @keyframes s { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
  <link rel="stylesheet" href="/src/fonts.css" />
</head>
<body>
  <main class="card" id="app" aria-live="polite"><div class="spin" role="status" aria-label="Loading"></div></main>
  <script type="module" src="/src/join.js"></script>
</body>
</html>
