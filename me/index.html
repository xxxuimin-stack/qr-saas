<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>My TapTayo</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/src/fonts.css" />
  <style>
    :root { --g: #C62828; --ink: #141414; --muted: #57534E; --line: #E7E5E4; }
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; color: var(--ink); background: #F6F7F5; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 100px; }
    body { background: #fff; }
    .narrow { max-width: 760px; margin: 0 auto; padding-top: 16px; }
    /* header (marketplace style) */
    .mh { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid #EEF0F2; }
    .mhin { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 8px; color: #C62828 !important; font-weight: 700; font-size: 20px; letter-spacing: -.03em; text-decoration: none; }
    .msearch { flex: 1; max-width: 560px; margin: 0 auto; display: flex; align-items: center; border: 1px solid #E5E7EB; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.07); padding: 5px 5px 5px 22px; gap: 14px; background: #fff; }
    .msearch label { flex: 1; display: grid; margin: 0; min-width: 0; } .msearch b { font-size: 12px; font-weight: 600; }
    .msearch input { border: 0; padding: 0; font: 400 14px Poppins, system-ui; color: #111; background: transparent; outline: none; }
    .msearch .sep { width: 1px; height: 30px; background: #E5E7EB; }
    .msearch button { flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; background: #C62828; color: #fff; display: grid; place-items: center; cursor: pointer; }
    .mright { display: flex; align-items: center; gap: 12px; } .lnk { font: 600 14px Poppins, system-ui; color: #111; text-decoration: none; background: none; border: 0; cursor: pointer; padding: 8px; border-radius: 10px; } .lnk.on { color: #C62828; }
    .av { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #FDE2E2; color: #B91C1C; font: 700 15px Poppins, system-ui; cursor: pointer; } .av.on { outline: 2px solid #C62828; outline-offset: 2px; }
    /* categories + marketplace grid */
    .cats { display: flex; gap: 30px; overflow-x: auto; border-bottom: 1px solid #EEF0F2; padding: 14px 2px 0; margin: 0 -2px; scrollbar-width: none; } .cats::-webkit-scrollbar { display: none; }
    .cat { flex: none; display: grid; justify-items: center; gap: 6px; padding: 0 2px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: #6B7280; font: 600 12.5px Poppins, system-ui; cursor: pointer; }
    .cat:hover { color: #111; border-bottom-color: #E5E7EB; } .cat.on { color: #111; border-bottom-color: #111; }
    .feedin { padding-top: 26px; } .fh { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 20px; align-items: start; }
    .mc { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; } .mc small { color: #6B7280; font-size: 13px; }
    .mc .im { position: relative; display: grid; place-items: center; aspect-ratio: 1 / 0.95; border-radius: 16px; background: #F3F4F6 center/cover; margin-bottom: 8px; color: #9CA3AF; }
    .mc .im i svg { width: 40px; height: 40px; }
    .mc .im em { position: absolute; left: 12px; top: 12px; font-style: normal; font-size: 12px; font-weight: 600; background: #fff; border-radius: 999px; padding: 4px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .mc .row1 { display: flex; justify-content: space-between; gap: 8px; } .mc .row1 b { font-size: 15px; min-width: 0; } .mc .row1 small { white-space: nowrap; flex: none; } .vf { color: #C62828; }
    .hrt { position: absolute; right: 10px; top: 10px; border: 0; background: none; cursor: pointer; padding: 4px; } .hrt.on svg path { fill: #C62828; }
    .posts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .nudge { display: flex; justify-content: space-between; align-items: center; gap: 12px; } .nudge > span { display: flex; gap: 10px; align-items: center; color: #4B5563; }
    .fp .lg svg { width: 22px; height: 22px; } .fp .lg { color: #6B7280; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .top a.brand { color: var(--ink); font-weight: 800; text-decoration: none; display: flex; gap: 8px; align-items: center; }
    h1 { font-size: 28px; letter-spacing: -.03em; margin: 20px 0 4px; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 14px 0; }
    .card h2 { margin: 0 0 10px; font-size: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; background: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; background: var(--g); color: #fff; font: 700 14px Poppins, system-ui; padding: 11px 16px; text-decoration: none; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: 500 15px Poppins, system-ui; }
    .bk { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
    .bk:first-child { border-top: 0; }
    .bk img, .bk .ph { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #F3F4F6; display: grid; place-items: center; flex-shrink: 0; }
    .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #F3F4F6; white-space: nowrap; }
    .pill.ok { background: #DCFCE7; color: #166534; } .pill.wait { background: #FEF3C7; color: #92400E; } .pill.off { background: #F3F4F6; color: #6B7280; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .search { display: flex; gap: 8px; } .search input { flex: 1; }
    .tabs { display: none; }
    .tabs button { border: 0; background: transparent; padding: 8px 6px; font: 600 11.5px Poppins, system-ui; color: #6B7280; cursor: pointer; display: grid; justify-items: center; gap: 3px; }
    .tabs button[aria-selected="true"] { color: #C62828; }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); } button.chip { cursor: pointer; font-family: inherit; white-space: nowrap; }
    .fshops { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0 4px; }
    .fs { flex: 0 0 140px; text-decoration: none; color: inherit; } .fs b { display: block; font-size: 13.5px; margin-top: 6px; } .fs small { color: var(--muted); font-size: 12px; }
    .fs .im { position: relative; display: grid; place-items: center; width: 140px; height: 140px; border-radius: 14px; background: #F3F4F6 center/cover; font-size: 34px; }
    .fs .im em { position: absolute; left: 6px; top: 6px; font-style: normal; font-size: 10.5px; font-weight: 700; background: #fff; border-radius: 999px; padding: 2px 7px; }
    .fp .hd { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; } .fp .hd img, .fp .lg { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #F3F4F6; display: grid; place-items: center; }
    .fp .hd small { display: block; color: var(--muted); font-size: 12px; } .fp p { margin: 10px 0 0; line-height: 1.5; white-space: pre-line; }
    .pics { display: grid; gap: 4px; margin-top: 10px; border-radius: 14px; overflow: hidden; } .pics img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; display: block; }
    .pics.n1 img { aspect-ratio: 4/3; } .pics.n2, .pics.n4 { grid-template-columns: 1fr 1fr; } .pics.n3 { grid-template-columns: 2fr 1fr; } .pics.n3 img:first-child { grid-row: span 2; aspect-ratio: auto; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .wrap { padding: 0 16px 90px; } .mhin { padding: 10px 16px; gap: 10px; flex-wrap: wrap; } .brand span { display: none; }
      .msearch { order: 3; flex-basis: 100%; max-width: none; padding-left: 16px; } .msearch .sep, .msearch .w { display: none; }
      .mright .lnk[data-goto] { display: none; } .mright { margin-left: auto; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } .mc .row1 small { display: none; } .mc .row1 b { font-size: 14px; } .posts { grid-template-columns: 1fr; } .cats { gap: 22px; } .fh { font-size: 20px; }
      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid #EEF0F2; padding: 4px 8px calc(6px + env(safe-area-inset-bottom)); }
    }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="mh"><div class="mhin">
    <a class="brand" href="/me/" aria-label="TapTayo home"><img src="/logo/taptayo-mark.svg" alt="" width="32" height="32" /><span>taptayo</span></a>
    <form class="msearch" id="ms" role="search"><label><b>What</b><input id="msq" placeholder="Nails, spa, laundry…" autocomplete="off"/></label><span class="sep"></span><label class="w"><b>Where</b><input id="msw" placeholder="Near me" autocomplete="off"/></label><button aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></form>
    <nav class="mright"><span id="langSlot"></span><a href="#" class="lnk" data-goto="book">My bookings</a><button type="button" class="av" id="avBtn" data-goto="me" aria-label="My profile">·</button><button class="lnk" id="out" hidden>Log out</button></nav>
  </div></header>
  <div class="wrap"><div id="app"><p class="muted" style="margin-top:40px">Loading…</p></div></div>
  <script type="module" src="/src/me.js"></script>
</body>
</html>
